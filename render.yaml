services:
  - type: web
    name: apaar-verify
    env: python
    buildCommand: pip install -r backend/requirements.txt && python backend/app/seed/seed_data.py
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./apaar_verify.db
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
